<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youness WebDev</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: #1e293b;
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 30px;
      font-size: 17px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      background: #334155;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .success {
      display: none;
      margin-top: 15px;
      color: #4ade80;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Youness</h1>

    <p class="subtitle">
      Web Development Services
    </p>

    <form action="https://formsubmit.co/7youness77@gmail.com" method="POST">

      <input
        type="email"
        name="email"
        placeholder="Your email"
        required
      >

      <textarea
        name="message"
        placeholder="Write your message..."
        required
      ></textarea>

      <input type="hidden" name="_subject" value="New message from Youness website">

      <input type="hidden" name="_captcha" value="false">

      <input
        type="hidden"
        name="_next"
        value="https://7younesswebdev.github.io/"
      >

      <button type="submit">
        Send Message
      </button>

    </form>
  </div>

</body>
</html>
